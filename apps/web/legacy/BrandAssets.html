<style>
/*******************************************************************
 * BrandAssets.html — the Qatar Mobile identity, defined ONCE.
 *
 * WHY THIS FILE EXISTS
 *   The brand used to live as literal hex values scattered through
 *   two stylesheets and four portals, and the company mark was the two
 *   letters "QM" drawn in a coloured box. Changing either meant a search
 *   and replace across the project and hoping nothing was missed.
 *
 *   Everything brand-related now has exactly one definition here. The
 *   stylesheets consume the variables; nothing else declares them.
 *
 * THE PALETTE
 *   --qm-cyan   #16BCDC  the accent. Buttons, selection, progress, focus.
 *   --qm-dark   #1F2024  dark surfaces and strong headings.
 *   --qm-white  #FFFFFF  the text inside a cyan button. Always.
 *   --qm-light  #F5F7F9  secondary surfaces.
 *
 * ONE NOTE ON --qm-cyan-ink
 *   White on #16BCDC measures about 2.3:1. That is fine for a large
 *   button face, which is what it was chosen for, and too low for an
 *   11px tab label or a text link on white. Cyan TEXT on a light
 *   background therefore uses --qm-cyan-ink (#0E7C93, 4.9:1), which is
 *   the same hue carried to a legible weight. Cyan FILLS — button faces,
 *   borders, progress bars, ticks — are always exactly #16BCDC.
 *
 * THE MARK AND THE WORDMARK
 *   --qm-logo is the official Qatar Mobile icon — the supplied SVG
 *   itself, base64'd into a data URI. Not a trace, not a redrawing and
 *   not a raster stand-in: the four gradients and every path are the
 *   original file, byte for byte, with only the whitespace between tags
 *   collapsed.
 *
 *   Inlined rather than linked because the app runs inside the Apps
 *   Script sandbox, where a second request for an asset means a Drive
 *   file, a sharing decision and a round trip. This costs about 6KB once.
 *
 *   Being a vector it is resolution-independent: the same declaration
 *   serves the 36px header mark, the 54px hero mark and the 56px sign-in
 *   mark, and stays sharp on any display density.
 *
 *   IT IS DECLARED IN EXACTLY ONE PLACE — here. Replacing the artwork is
 *   this one line and nothing else.
 *******************************************************************/

  --qm-cyan-hov:  #14AFCB;

/* The wordmark. Sized by HEIGHT; its width follows from the artwork's
   own 1674:471 ratio, so it can never be squeezed. */
.qm-wordmark {
  background-image: var(--qm-wordmark);
  background-repeat: no-repeat;
  background-position: left center;
  background-size: contain;
  aspect-ratio: 1674 / 471;
  flex: 0 1 auto;
}

/* The mark itself. Square box, contained image, aspect ratio preserved
   by background-size: contain — it cannot be stretched by a caller. */
.qm-logo {
  background-image: var(--qm-logo);
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  flex: 0 0 auto;
}

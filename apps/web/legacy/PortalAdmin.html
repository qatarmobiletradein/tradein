QM.route('a-reports', function (params) {
  var filters = params.filters || { reportType: 'TRADEIN', groupBy: 'vendor' };
  var wrap = QM.el('div');

  var controls = [
    { key: 'reportType', type: 'select', label: 'Report', value: filters.reportType,
      options: [
        { value: 'TRADEIN',    label: 'Trade-ins' },
        { value: 'VOUCHER',    label: 'Vouchers' },
        { value: 'COLLECTION', label: 'Collections' },
        { value: 'SETTLEMENT', label: 'Settlements' },
        { value: 'INSPECTION', label: 'Inspections' }
      ] }
  ];

  // Grouping only means something for the trade-in report; the others
  // are lists of their own records. Showing a control that does nothing
  // is worse than not showing it.
  if (!filters.reportType || filters.reportType === 'TRADEIN') {
    controls.push({ key: 'groupBy', type: 'select', label: 'Group by',
      value: filters.groupBy,
      options: [
        { value: 'vendor', label: 'Vendor' },
        { value: 'branch', label: 'Branch' },
        { value: 'month',  label: 'Month' },
        { value: 'day',    label: 'Day' },
        { value: 'grade',  label: 'Grade' },
        { value: 'brand',  label: 'Brand' },
        { value: 'model',  label: 'Model' },
        { value: 'device', label: 'Device (model and storage)' },
        { value: 'technician', label: 'Technician' },
        { value: 'status', label: 'Status' }
      ] });
  }

  controls.push({ key: 'from', type: 'date', label: 'From', value: filters.from });
  controls.push({ key: 'to',   type: 'date', label: 'To',   value: filters.to });

  wrap.appendChild(filterBar(controls, function (f) {
    QM.go('a-reports', { filters: f });
  }));

  wrap.appendChild(QM.el('div', 'hint mb',
    'From and To include the WHOLE of both days. A range ending on the 8th ' +
    'covers everything up to 23:59 on the 8th.'));

  var list = QM.el('div');
  wrap.appendChild(list);
  list.appendChild(QM.loadingBlock());

  QM.call('admin.reports', filters).then(function (res) {
    QM.clear(list);
    if (!res.ok) { list.appendChild(QM.errorBlock(res.message)); return; }

    /* ---- headline numbers, per report type ------------------------ */
    var grid = QM.el('div', 'grid cols-4 mb');
    var t = res.totals || {};

    if (res.reportType === 'COLLECTION') {
      grid.appendChild(QM.kpi('Notes', t.count, 'In this period'));
      grid.appendChild(QM.kpi('Expected', t.expected, 'Value sent for',
        { money: true }));
      grid.appendChild(QM.kpi('Actually collected', t.actual, 'Value received',
        { money: true }));
      grid.appendChild(QM.kpi('Exceptions', t.exceptions,
        'Notes with a device unaccounted for',
        { attention: t.exceptions > 0 }));

    } else if (res.reportType === 'SETTLEMENT') {
      grid.appendChild(QM.kpi('Settlements', t.count, 'In this period'));
      grid.appendChild(QM.kpi('Total', t.settlement, 'Across all statuses',
        { money: true }));
      grid.appendChild(QM.kpi('Commission', t.commission, 'Vendor share',
        { money: true }));
      grid.appendChild(QM.kpi('Outstanding', t.outstanding, 'Raised, not yet paid',
        { money: true, attention: t.outstanding > 0 }));

    } else if (res.reportType === 'INSPECTION') {
      grid.appendChild(QM.kpi('Inspections', t.count, 'In this period'));
      grid.appendChild(QM.kpi('Customer value', t.customerValue, 'Offered',
        { money: true }));

    } else {
      grid.appendChild(QM.kpi('Devices', t.count, 'In this period'));
      grid.appendChild(QM.kpi('Estimated', t.estimated,
        'What customers were told', { money: true }));
      grid.appendChild(QM.kpi('Offered', t.customerValue,
        'What they were paid', { money: true }));
      grid.appendChild(QM.kpi('Difference', t.variance,
        'Offered against estimated',
        { money: true, attention: t.variance < 0 }));
    }
    list.appendChild(grid);

    /* ---- the report itself ----------------------------------------- */
    if (res.groups && res.reportType === 'TRADEIN') {
      list.appendChild(QM.table([
        { key: 'label', label: 'Group' },
        { key: 'count', label: 'Devices', numeric: true },
        { key: 'estimated', label: 'Estimated', numeric: true,
          render: function (r) { return QM.money(r.estimated); } },
        { key: 'customerValue', label: 'Customer', numeric: true,
          render: function (r) { return QM.money(r.customerValue); } },
        { key: 'variancePct', label: 'Variance', numeric: true,
          render: function (r) {
            if (r.variancePct === null) return QM.el('span', 'muted', '—');
            var kind = r.variancePct < -15 ? 'warn' : '';
            return QM.el('span', 'pill ' + kind,
              (r.variancePct >= 0 ? '+' : '') + r.variancePct + '%');
          } },
        { key: 'commission', label: 'Commission', numeric: true,
          render: function (r) { return QM.money(r.commission); } },
        { key: 'settlement', label: 'Total', numeric: true,
          render: function (r) { return QM.money(r.settlement); } }
      ], res.groups));

    } else if (res.reportType === 'INSPECTION') {
      list.appendChild(QM.table([
        { key: 'label', label: 'Technician' },
        { key: 'count', label: 'Inspections', numeric: true },
        { key: 'averageScore', label: 'Average score', numeric: true },
        { key: 'averageVariancePct', label: 'Average variance', numeric: true,
          render: function (r) {
            return r.averageVariancePct === null ? '—'
              : (r.averageVariancePct >= 0 ? '+' : '') + r.averageVariancePct + '%';
          } },
        { key: 'overrides', label: 'Grade overrides', numeric: true },
        { key: 'gradeMix', label: 'Grade mix',
          render: function (r) {
            var box = QM.el('div', 'gap');
            (r.gradeMix || []).forEach(function (g) {
              box.appendChild(QM.el('span', 'pill', g.label + ' ×' + g.count));
            });
            return box;
          } }
      ], res.groups));

      list.appendChild(QM.el('div', 'hint',
        'Grading is meant to be objective, so two technicians working the ' +
        'same counter should produce similar grade mixes. A persistent ' +
        'difference between them is worth a conversation.'));

    } else if (res.rows) {
      // The list-shaped reports arrive as columns and rows.
      list.appendChild(QM.table(
        res.columns.map(function (c, i) {
          return { key: 'c' + i, label: c,
                   numeric: /value|amount|total|commission|devices|expected|collected|missing|exceptions/i.test(c),
                   render: function (row) { return row[i]; } };
        }),
        res.rows));
    }

    /* ---- export ----------------------------------------------------- */
    var exportRow = QM.el('div', 'btn-row mt');
    exportRow.appendChild(QM.button('Download CSV', function () {
      var f = {};
      Object.keys(filters).forEach(function (k) { f[k] = filters[k]; });
      f.asCsv = true;
      QM.call('admin.reports', f).then(function (csvRes) {
        if (!csvRes.ok || !csvRes.csv) {
          QM.toast('That report could not be exported.', 'danger');
          return;
        }
        downloadCsv((res.reportType || 'report').toLowerCase() + '-' +
                    (filters.from || 'all') + '-to-' + (filters.to || 'now') + '.csv',
                    csvRes.csv);
      });
    }, 'secondary'));
    list.appendChild(exportRow);
  });

  return wrap;
});

/**
 * Save a CSV without leaving the page.
 *
 * A published Apps Script app runs inside a sandboxed iframe, so a plain
 * download link is blocked. A Blob URL opened from a click the user made
 * is not — and the BOM matters: without it Excel reads an Arabic branch
 * name as mojibake, which is exactly the column somebody will check.
 */
function downloadCsv(filename, text) {
  try {
    var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
  } catch (e) {
    // If the sandbox refuses, show the text so it can still be copied
    // out rather than leaving somebody with a button that does nothing.
    var body = QM.el('div');
    var area = QM.el('textarea');
    area.value = text;
    area.rows = 14;
    body.appendChild(QM.el('p', 'soft',
      'Your browser blocked the download. Copy the text below instead.'));
    body.appendChild(area);
    QM.modal({ title: filename, body: body, confirmLabel: '', cancelLabel: 'Close' });
    setTimeout(function () { area.select(); }, 60);
  }
}

      placeholder: 'A reference', value: filters.objectId },

  ], function (f) { QM.go('a-audit', { filters: f }); }));

  var list = QM.el('div');
  wrap.appendChild(list);
  list.appendChild(QM.loadingBlock());

  QM.call('admin.audit', filters).then(function (res) {

    list.appendChild(QM.el('div', 'small muted mb',
      'Showing ' + res.shown + ' of ' + res.total + ' entries.'));

    list.appendChild(QM.table([
      { key: 'timestamp', label: 'When' },
      { key: 'actor', label: 'Who' },
      { key: 'role', label: 'Role' },
      { key: 'action', label: 'Action',

                       r.action === 'VOUCHER_BLOCKED_NO_DEVICE';

        } },
      { key: 'objectId', label: 'Object', className: 'mono' },
      { key: 'oldValue', label: 'Was' },
      { key: 'newValue', label: 'Now' }
    ], res.entries));
  });

  return wrap;
});

QM.route('a-settings', function () {
  return QM.call('admin.settings', {}).then(function (res) {
    if (!res.ok) return QM.errorBlock(res.message);

    var wrap = QM.el('div');
    var h = res.health;

    /* ---- the state of the system, said plainly -------------------- */
    if (h.devMode) {
      var dev = QM.el('div', 'notice danger');
      dev.appendChild(QM.el('strong', null, 'Test mode is on'));
      dev.appendChild(document.createTextNode(h.devModeWarning));
      wrap.appendChild(dev);
    }

    var health = QM.el('div', 'grid cols-4 mb');
    health.appendChild(QM.kpi('Version', res.version || '—',
      res.versionLabel || ''));
    health.appendChild(QM.kpi('SMS provider', h.smsProvider,
      h.smsProvider === 'NONE' ? 'No messages are being sent' : 'Codes are sent by SMS',
      { attention: h.smsProvider === 'NONE' }));
    health.appendChild(QM.kpi('Unpriced variants', h.unpricedVariants,
      'Cannot be quoted at all', { attention: h.unpricedVariants > 0 }));
    health.appendChild(QM.kpi('Grade ladder', h.gradeLadderValid ? 'Valid' : 'INVALID',
      'Checked against the pricing rules',
      { attention: !h.gradeLadderValid }));
    health.appendChild(QM.kpi('Platform owners', h.activeSuperAdmins,
      'The last one cannot be disabled',
      { attention: h.activeSuperAdmins < 2 }));
    wrap.appendChild(health);

    /* ---- editable settings ---------------------------------------- */
    var body = QM.el('div');
    body.appendChild(QM.el('div', 'hint mb',
      'Anything that changes how money is calculated — prices, grades, ' +
      'commission — lives on its own page with its own history, not here.'));

    res.settings.forEach(function (s) {
      var control = QM.input(s.type === 'NUMBER' ? 'number' : 'text', s.value);
      var f = QM.field(s.label, control);

      var save = QM.button('Save', function () {
        QM.call('admin.saveSetting', {
          key: s.key, value: control.value
        }).then(function (r) { QM.report(r); });
      }, 'small secondary');
      f.appendChild(save);

      body.appendChild(f);
    });

    wrap.appendChild(QM.card('Settings', body));

    return wrap;
  });
});

<script>
/*******************************************************************
 * PortalAdmin.html — Qatar Mobile's own screens.
 *
 * SEPARATE PAGES, NOT ONE DASHBOARD WITH TABS
 *   Pricing, catalogue, vendors, staff, customers, collections,
 *   settlements, reports and audit each get their own page. A single
 *   screen carrying all of it is where somebody edits a commission rate
 *   while meaning to edit a price.
 *
 * THE ONE NUMBER AN ADMINISTRATOR TYPES IS THE BASE PRICE
 *   There is no field anywhere in this file for a "Grade C price". The
 *   pricing screen takes one number, shows the whole ladder it produces,
 *   and saves that. Per-grade entry is how a catalogue ends up with
 *   inconsistent ladders that nobody notices for months.
 *
 * DESTRUCTIVE THINGS ASK FOR A REASON
 *   Cancelling a price, voiding a voucher, disabling an account. The
 *   server refuses all of them without one; asking here means nobody is
 *   told "no" after committing to the action.
 *******************************************************************/

QM.portal('admin', function (me) {
  var isOwner = me.role === 'SUPER_ADMIN';

  buildFrame({
    mark: 'QM',
    title: me.platform,
    nav: [
      { page: 'a-home',        label: 'Dashboard',   icon: '▦' },

      { section: 'Operations' },
      { page: 'a-tradeins',    label: 'Trade-ins',   icon: '▤' },
      { page: 'a-collections', label: 'Collections', icon: '⇩' },
      { page: 'a-settlements', label: 'Settlements', icon: '◱' },

      { section: 'Catalogue' },
      { page: 'a-pricing',     label: 'Pricing',     icon: '¤', badge: '0' },
      { page: 'a-products',    label: 'Products',    icon: '▢' },
      { page: 'a-brands',      label: 'Brands',      icon: '◈' },
      { page: 'a-categories',  label: 'Categories',  icon: '⊞' },
      { page: 'a-import',      label: 'Bulk import', icon: '⇪' },
      { page: 'a-grades',      label: 'Grade ladder',icon: '◑' },
      { page: 'a-inspection',  label: 'Inspection rules', icon: '◎' },

      { section: 'Marketplace' },
      { page: 'a-vendors',     label: 'Vendors',     icon: '⌂' },
      { page: 'a-branches',    label: 'Branches',    icon: '⌗' },
      { page: 'a-commission',  label: 'Commission',  icon: '％' },

      { section: 'People' },
      { page: 'a-staff',       label: 'Staff',       icon: '☺', badge: '0' },
      { page: 'a-customers',   label: 'Customers',   icon: '☻' },

      { section: 'System' },
      { page: 'a-reports',     label: 'Reports',     icon: '◔' },
      { page: 'a-audit',       label: 'Audit log',   icon: '❐' },
      { page: 'a-settings',    label: 'Settings',    icon: '⚙' }
    ]
  });
});

/* ====================================================================
 * DASHBOARD
 * ================================================================== */

QM.route('a-home', function () {
  return QM.call('admin.dashboard', {}).then(function (res) {
    if (!res.ok) return QM.errorBlock(res.message);

    var wrap = QM.el('div');
    var a = res.attention;

    setBadge('a-pricing', a.unpricedVariants);
    setBadge('a-staff', a.pendingStaff);

    /* ---- what needs a person -------------------------------------
     * Above the numbers on purpose. A dashboard whose first row is
     * revenue and whose problems are below the fold is a dashboard that
     * gets read as reassurance.
     * -------------------------------------------------------------- */
    var problems = [];
    if (a.unpricedVariants) {
      problems.push(a.unpricedVariants +
        ' variant(s) have no price and cannot be quoted at all');
    }
    if (a.pendingStaff) {
      problems.push(a.pendingStaff + ' person(s) waiting for approval');
    }
    if (a.stuckOverAWeek) {
      problems.push(a.stuckOverAWeek + ' trade-in(s) have not moved in over a week');
    }
    if (a.unsettledCollected > 0) {
      problems.push(QM.moneyCcy(a.unsettledCollected) +
        ' collected and not yet settled');
    }
    if (a.undatedCollected) {
      problems.push(a.undatedCollected + ' collected device(s) have no collection ' +
        'date, so no settlement run can ever pick them up');
    }
    if (a.collectionExceptions) {
      problems.push(a.collectionExceptions +
        ' collection note(s) have a device nobody could account for');
    }

    if (problems.length) {
      var n = QM.el('div', 'notice warn');
      n.appendChild(QM.el('strong', null, 'Needs attention'));
      var ul = QM.el('ul');
      ul.style.margin = '.4rem 0 0'; ul.style.paddingLeft = '1.2rem';
      problems.forEach(function (p) { ul.appendChild(QM.el('li', null, p)); });
      n.appendChild(ul);
      wrap.appendChild(n);
    }

    /* ---- money --------------------------------------------------- */
    var grid = QM.el('div', 'grid cols-4 mb');
    grid.appendChild(QM.kpi('Today', res.today.submitted,
      'Trade-ins started today'));
    grid.appendChild(QM.kpi('This month', res.month.submitted,
      'Trade-ins started since the 1st'));
    grid.appendChild(QM.kpi('Paid to customers', res.month.customerValue,
      'This month', { money: true }));
    grid.appendChild(QM.kpi('Commission owed', res.month.commission,
      'To vendors, this month', { money: true }));
    wrap.appendChild(grid);

    /* ---- the pipeline -------------------------------------------- */
    var q = res.queues;
    var queues = QM.el('div', 'grid cols-4 mb');
    queues.appendChild(QM.kpi('To inspect', q.awaitingInspection,
      'Waiting for a technician'));
    queues.appendChild(QM.kpi('With customer', q.awaitingCustomer,
      'Offer made, no answer yet'));
    queues.appendChild(QM.kpi('To voucher', q.awaitingVoucher,
      'Device here, vendor has not issued'));
    queues.appendChild(QM.kpi('To collect', q.awaitingCollection,
      'Paid for, still in the shop',
      { attention: q.awaitingCollection > 0 }));
    wrap.appendChild(queues);

    /* ---- the marketplace, and the average the totals hide ---------- */
    var m = res.marketplace || {};
    var scale = QM.el('div', 'grid cols-4 mb');
    scale.appendChild(QM.kpi('Vendors', m.vendors, 'Active partners'));
    scale.appendChild(QM.kpi('Branches', m.branches, 'Accepting trade-ins'));
    scale.appendChild(QM.kpi('Average trade-in', (res.average || {}).tradeInValue,
      'Across every completed device', { money: true }));
    scale.appendChild(QM.kpi('Paid settlements',
      (res.settlementSummary || {}).paid,
      QM.moneyCcy((res.settlementSummary || {}).paidValue) + ' paid to vendors'));
    wrap.appendChild(scale);

    /* ---- the rest of the pipeline ---------------------------------- */
    var q2 = QM.el('div', 'grid cols-4 mb');
    q2.appendChild(QM.kpi('Collected', q.awaitingSettlement,
      'Ours, not yet settled'));
    q2.appendChild(QM.kpi('Pending settlement',
      (res.settlementSummary || {}).pending, 'Draft, submitted or approved'));
    q2.appendChild(QM.kpi('Returns', q.returnsPending,
      'Going back to a customer'));
    q2.appendChild(QM.kpi('Collection exceptions',
      a.collectionExceptions,
      'Notes with a device unaccounted for',
      { attention: a.collectionExceptions > 0 }));
    wrap.appendChild(q2);

    /* ---- top branches and models ----------------------------------- */
    if (res.branchesTop && res.branchesTop.length) {
      wrap.appendChild(QM.card('Busiest branches', QM.table([
        { key: 'label', label: 'Branch' },
        { key: 'count', label: 'Trade-ins', numeric: true },
        { key: 'value', label: 'Paid out', numeric: true,
          render: function (r) { return QM.money(r.value); } }
      ], res.branchesTop)));
    }

    if (res.modelsTop && res.modelsTop.length) {
      wrap.appendChild(QM.card('Most traded models', QM.table([
        { key: 'label', label: 'Model' },
        { key: 'count', label: 'Devices', numeric: true },
        { key: 'value', label: 'Paid out', numeric: true,
          render: function (r) { return QM.money(r.value); } }
      ], res.modelsTop)));
    }

    /* ---- vendors -------------------------------------------------- */
    if (res.vendors && res.vendors.length) {
      wrap.appendChild(QM.card('Vendors', QM.table([
        { key: 'vendorName', label: 'Vendor' },
        { key: 'tradeIns', label: 'Trade-ins', numeric: true },
        { key: 'completed', label: 'Completed', numeric: true },
        { key: 'customerValue', label: 'Paid out', numeric: true,
          render: function (r) { return QM.money(r.customerValue); } },
        { key: 'commission', label: 'Commission', numeric: true,
          render: function (r) { return QM.money(r.commission); } },
        { key: 'settlement', label: 'Total cost', numeric: true,
          render: function (r) { return QM.money(r.settlement); } }
      ], res.vendors)));
    }

    /* ---- grade mix ------------------------------------------------ */
    wrap.appendChild(QM.card('Condition mix this month', QM.table([
      { key: 'code', label: 'Grade',
        render: function (r) { return QM.gradeChip(r.code); } },
      { key: 'name', label: 'Condition' },
      { key: 'count', label: 'Devices', numeric: true },
      { key: 'percentage', label: 'Share', numeric: true,
        render: function (r) { return r.percentage + '%'; } }
    ], res.grades)));

    return wrap;
  });
});

/* ====================================================================
 * PRICING
 *
 * The most consequential screen in the system, so it is also the
 * plainest: one number in, the whole ladder shown, nothing else typed.
 * ================================================================== */

QM.route('a-pricing', function (params) {
  var filters = params.filters || { status: 'UNPRICED' };
  var wrap = QM.el('div');

  var note = QM.el('div', 'notice');
  note.appendChild(QM.el('strong', null, 'One price per storage size'));
  note.appendChild(document.createTextNode(
    'You enter the Grade A price — what a device in excellent condition is ' +
    'worth. Every other grade is a percentage of it, so the ladder can never ' +
    'be inconsistent.'));
  wrap.appendChild(note);

  /* ---- vendor override pricing --------------------------------------
   * The server has supported per-vendor prices since V2 — resolveBasePrice_
   * checks a vendor list before the master one — and no screen ever sent a
   * vendorId, so the feature was unreachable. Choosing a vendor here shows
   * their overrides beside the master price and lets one be set.
   * ------------------------------------------------------------------ */
  var vendorRow = QM.el('div', 'notice');
  vendorRow.appendChild(QM.el('strong', null,
    filters.vendorId ? 'Showing one vendor\'s price list'
                     : 'Showing Qatar Mobile\'s master price list'));
  vendorRow.appendChild(document.createTextNode(
    filters.vendorId
      ? 'A vendor override beats the master price for that vendor only, and ' +
        'only while it is in force. Everything without an override falls back ' +
        'to the master price.'
      : 'Choose a vendor to see and set their own prices.'));
  wrap.appendChild(vendorRow);

  var vendorSelect = QM.select([{ value: '', label: 'Master price list' }],
                               filters.vendorId);
  vendorSelect.dataset.key = 'vendorId';
  QM.call('admin.vendors', {}).then(function (res) {
    if (!res.ok) return;
    res.vendors.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v.vendorId;
      opt.textContent = v.name;
      if (filters.vendorId === v.vendorId) opt.selected = true;
      vendorSelect.appendChild(opt);
    });
  });
  vendorSelect.onchange = function () {
    var f = {};
    Object.keys(filters).forEach(function (k) { f[k] = filters[k]; });
    f.vendorId = vendorSelect.value;
    QM.go('a-pricing', { filters: f });
  };
  wrap.appendChild(QM.field('Price list', vendorSelect));

  wrap.appendChild(filterBar([
    { key: 'status', type: 'select', label: 'Show', value: filters.status,
      options: [
        { value: 'UNPRICED', label: 'Needs a price' },
        { value: 'PRICED', label: 'Priced' },
        { value: '', label: 'Everything' }
      ] },
    { key: 'search', type: 'search', label: 'Search',
      placeholder: 'Model or storage', value: filters.search }
  ], function (f) {
    f.vendorId = filters.vendorId || '';
    QM.go('a-pricing', { filters: f });
  }));

  var list = QM.el('div');
  wrap.appendChild(list);
  list.appendChild(QM.loadingBlock());

  QM.call('admin.pricing', filters).then(function (res) {
    QM.clear(list);
    if (!res.ok) { list.appendChild(QM.errorBlock(res.message)); return; }

    setBadge('a-pricing', res.unpriced);

    if (res.unpriced) {
      var warn = QM.el('div', 'notice warn');
      warn.appendChild(QM.el('strong', null,
        res.unpriced + ' variant(s) cannot be quoted'));
      warn.appendChild(document.createTextNode(
        'A customer choosing one of these is told we are not buying that model. ' +
        'They are not worth zero — they have no price at all.'));
      list.appendChild(warn);
    }

    if (!res.rows.length) {
      list.appendChild(QM.emptyBlock('Nothing matches'));
      return;
    }

    var columns = [
      { key: 'brand', label: 'Brand' },
      { key: 'model', label: 'Model' },
      { key: 'storage', label: 'Storage' },
      { key: 'masterPrice', label: 'Master', numeric: true,
        render: function (r) {
          return r.masterPrice === null ? QM.el('span', 'muted', '—')
                                        : QM.money(r.masterPrice);
        } }
    ];

    if (filters.vendorId) {
      columns.push({ key: 'vendorPrice', label: 'This vendor', numeric: true,
        render: function (r) {
          return r.vendorPrice === null
            ? QM.el('span', 'muted', 'uses master')
            : QM.el('span', 'strong', QM.money(r.vendorPrice));
        } });
    }

    columns.push({ key: 'resolvedPrice', label: 'In force', numeric: true,
      render: function (r) {
        if (r.resolvedPrice === null) return QM.el('span', 'pill warn', 'No price');
        return QM.el('span', 'strong', QM.money(r.resolvedPrice));
      } });

    columns.push({ key: 'grades', label: 'Ladder',
      render: function (r) {
        if (!r.grades.length) return QM.el('span', 'muted', '—');
        var box = QM.el('div', 'gap');
        r.grades.forEach(function (g) {
          box.appendChild(QM.el('span', 'pill', g.code + ' ' + QM.money(g.value)));
        });
        return box;
      } });

    list.appendChild(QM.table(columns, res.rows, {
      onClick: function (row) { editPrice(row, filters.vendorId); }
    }));
  });

  return wrap;
});

function editPrice(row, vendorId) {
  var body = QM.el('div');

  body.appendChild(detailList([
    { label: 'Device', value: row.brand + ' ' + row.model },
    { label: 'Storage', value: row.storage },
    { label: 'Price list', value: vendorId ? 'Vendor override' : 'Master' },
    { label: 'Master price',
      value: row.masterPrice === null ? 'None' : QM.moneyCcy(row.masterPrice) },
    { label: 'Vendor override',
      value: !vendorId ? null
           : (row.vendorPrice === null ? 'None — uses the master price'
                                       : QM.moneyCcy(row.vendorPrice)) }
  ]));

  var current = vendorId ? row.vendorPrice : row.masterPrice;
  var price = QM.input('number', current === null ? '' : current);
  price.min = 0; price.step = '1';
  body.appendChild(QM.field(
    vendorId ? 'Vendor base price (Grade A)' : 'Base price (Grade A)', price,
    'What this device is worth in excellent condition.'));

  var from = QM.input('date');
  body.appendChild(QM.field('Effective from', from,
    'Leave blank for today. The price in force is CLOSED with this date ' +
    'rather than overwritten, so a trade-in from last week still resolves ' +
    'to the price it was quoted at.'));

  /* ---- the history, which V2 could produce and never showed -------- */
  var history = QM.el('div');
  body.appendChild(history);

  QM.call('admin.priceHistory', {
    variantId: row.variantId, vendorId: vendorId || ''
  }).then(function (res) {
    if (!res.ok || !res.history.length) return;
    history.appendChild(QM.el('div', 'label mt', 'Price history'));
    history.appendChild(QM.table([
      { key: 'basePrice', label: 'Price', numeric: true,
        render: function (h) { return QM.money(h.basePrice); } },
      { key: 'effectiveFrom', label: 'From' },
      { key: 'effectiveTo', label: 'To' },
      { key: 'cancelled', label: '',
        render: function (h) {
          return h.cancelled ? QM.el('span', 'pill danger', 'Cancelled')
                             : QM.el('span');
        } }
    ], res.history));
    history.appendChild(QM.el('div', 'hint',
      'A closed price stays active — it was real, and a trade-in from that ' +
      'period must still resolve to it. Only a price entered in error is ' +
      'cancelled, and a cancelled row is excluded at every date.'));
  });

  var preview = QM.el('div');
  body.appendChild(preview);

  function drawPreview() {
    QM.clear(preview);
    var base = Number(price.value);
    if (!isFinite(base) || base <= 0) return;

    // Drawn from the same percentages the server uses, so what an
    // administrator sees before saving is what a customer is offered.
    var t = QM.el('table');
    var tb = QM.el('tbody');
    (window.__gradeLadder || []).forEach(function (g) {
      var tr = QM.el('tr');
      tr.appendChild(QM.el('td', null, g.code + ' — ' + g.name));
      tr.appendChild(QM.el('td', null, Math.round(g.percentage * 100) + '%'));
      tr.appendChild(QM.el('td', 'num strong',
        QM.money(Math.round(base * g.percentage * 100) / 100)));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    preview.appendChild(QM.el('div', 'label mt', 'What each grade would pay'));
    preview.appendChild(t);
  }

  // The ladder is fetched once and cached on the window, because it is
  // the same for every row on the screen.
  if (!window.__gradeLadder) {
    QM.call('admin.gradeRules', {}).then(function (res) {
      if (res.ok) { window.__gradeLadder = res.grades; drawPreview(); }
    });
  } else {
    drawPreview();
  }
  price.oninput = drawPreview;

  QM.modal({
    title: vendorId ? 'Set vendor price' : 'Set base price',
    body: body,
    confirmLabel: 'Save price',
    collect: function () {
      var v = Number(price.value);
      if (!isFinite(v) || v < 0) { QM.toast('Enter a price.', 'danger'); return false; }
      return {
        variantId: row.variantId,
        basePrice: v,
        vendorId: vendorId || '',
        effectiveFrom: from.value
      };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.setBasePrice', data).then(function (res) {
      if (QM.report(res)) QM.go('a-pricing', { filters: { vendorId: vendorId || '' } });
    });
  });
}

/* ====================================================================
 * GRADE LADDER
 * ================================================================== */

QM.route('a-grades', function () {
  return QM.call('admin.gradeRules', {}).then(function (res) {
    if (!res.ok) return QM.errorBlock(res.message);

    var wrap = QM.el('div');

    var note = QM.el('div', 'notice');
    note.appendChild(QM.el('strong', null, 'Every grade is a share of the base price'));
    note.appendChild(document.createTextNode(
      'Never of the grade above it. Changing a percentage here affects future ' +
      'offers only — trade-ins already made keep the percentage they were quoted at.'));
    wrap.appendChild(note);

    if (!res.valid) {
      var bad = QM.el('div', 'notice danger');
      bad.appendChild(QM.el('strong', null, 'This ladder is not safe to price with'));
      var ul = QM.el('ul');
      ul.style.margin = '.4rem 0 0'; ul.style.paddingLeft = '1.2rem';
      res.problems.forEach(function (p) { ul.appendChild(QM.el('li', null, p)); });
      bad.appendChild(ul);
      wrap.appendChild(bad);
    }

    wrap.appendChild(QM.table([
      { key: 'code', label: 'Grade',
        render: function (r) { return QM.gradeChip(r.code); } },
      { key: 'name', label: 'Condition' },
      { key: 'percentLabel', label: 'Of base price' },
      { key: 'minScore', label: 'Minimum score', numeric: true },
      { key: 'example', label: 'On a 2,000 device', numeric: true,
        render: function (r) {
          var match = res.example.filter(function (e) { return e.code === r.code; })[0];
          return match ? QM.money(match.value) : '—';
        } }
    ], res.grades, { onClick: function (row) { editGrade(row); } }));

    return wrap;
  });
});

function editGrade(grade) {
  var body = QM.el('div');

  var warn = QM.el('div', 'notice warn');
  warn.appendChild(QM.el('strong', null, 'This reprices the whole catalogue'));
  warn.appendChild(document.createTextNode(
    'Every future offer at grade ' + grade.code + ' uses this percentage.'));
  body.appendChild(warn);

  var name = QM.input('text', grade.name);
  body.appendChild(QM.field('Condition name', name));

  var pct = QM.input('number', grade.percentage);
  pct.min = 0; pct.max = 1; pct.step = '0.01';
  body.appendChild(QM.field('Share of base price', pct,
    'Written as a fraction. Seventy percent is 0.7.'));

  var minScore = QM.input('number', grade.minScore);
  minScore.min = 0; minScore.max = 100;
  body.appendChild(QM.field('Minimum inspection score', minScore,
    'A device scoring this or above earns this grade.'));

  var example = QM.el('div', 'notice');
  body.appendChild(example);

  function updateExample() {
    QM.clear(example);
    var p = Number(pct.value);
    if (!isFinite(p)) return;
    example.appendChild(QM.el('strong', null,
      'A 2,000 device would pay ' + QM.money(2000 * p)));
  }
  updateExample();
  pct.oninput = updateExample;

  QM.modal({
    title: 'Grade ' + grade.code,
    body: body,
    confirmLabel: 'Save',
    collect: function () {
      var p = Number(pct.value);
      if (!isFinite(p) || p < 0 || p > 1) {
        QM.toast('A percentage is between 0 and 1.', 'danger'); return false;
      }
      return {
        gradeCode: grade.code,
        gradeName: name.value.trim(),
        percentage: p,
        minScore: Number(minScore.value),
        order: grade.order,
        terminal: grade.terminal,
        active: true
      };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.saveGradeRule', data).then(function (res) {
      if (QM.report(res)) { window.__gradeLadder = null; QM.go('a-grades'); }
    });
  });
}

/* ====================================================================
 * INSPECTION RULES
 *
 * What each fault costs. This is the ONLY screen in the system that
 * shows these numbers — the technician deliberately never sees them,
 * because somebody who knows the back glass is worth ten points can
 * work backwards from the grade they want.
 * ================================================================== */

QM.route('a-inspection', function () {
  return QM.call('admin.inspectionRules', {}).then(function (res) {
    if (!res.ok) return QM.errorBlock(res.message);

    var wrap = QM.el('div');

    var note = QM.el('div', 'notice');
    note.appendChild(QM.el('strong', null, 'The technician answers; the system grades'));
    note.appendChild(document.createTextNode(
      'Every device starts at 100. Each fault below subtracts its impact, ' +
      'and the score that remains maps onto the grade ladder. No technician ' +
      'chooses a grade, and none of these numbers reaches their screen.'));
    wrap.appendChild(note);

    // Anything still marked NEEDS_APPROVAL is a number nobody has signed
    // off. Surfacing it here is the whole point of the flag.
    var unapproved = res.rules.filter(function (r) {
      return /NEEDS_APPROVAL/i.test(r.notes || '');
    });
    if (unapproved.length) {
      var warn = QM.el('div', 'notice warn');
      warn.appendChild(QM.el('strong', null,
        unapproved.length + ' impact(s) still need your approval'));
      warn.appendChild(document.createTextNode(
        'These questions are new, so their impacts are a starting proposal ' +
        'rather than an agreed figure. Open each one and set the number you ' +
        'want; saving clears the flag.'));
      wrap.appendChild(warn);
    }

    /* ---- the band cliff, stated before it costs anybody money ------
     * Worth saying out loud: grade A starts at 95, so any fault worth
     * more than five points drops a device straight to B — which pays
     * 70%. On a 2,000 handset a single light scratch is a 600 riyal
     * difference. That may be exactly right, or it may be far harsher
     * than intended, but it should be a decision rather than a surprise.
     * -------------------------------------------------------------- */
    var top = null, second = null;
    QM.call('admin.gradeRules', {}).then(function (g) {
      if (!g.ok || g.grades.length < 2) return;
      window.__gradeLadder = g.grades;
      top = g.grades[0]; second = g.grades[1];

      var headroom = 100 - top.minScore;
      var tight = res.rules.filter(function (r) {
        return !r.blocking && r.impact > headroom;
      });
      if (!tight.length) return;

      var cliff = QM.el('div', 'notice');
      cliff.appendChild(QM.el('strong', null,
        'Grade ' + top.code + ' allows only ' + headroom + ' points of wear'));
      cliff.appendChild(document.createTextNode(
        tight.length + ' of these faults cost more than that on their own, so ' +
        'a device with any one of them drops to ' + second.code + ' — ' +
        Math.round((1 - second.percentage / top.percentage) * 100) +
        '% less, whether the fault is trivial or serious. Widen ' + top.code +
        ' on the grade ladder, or lower these impacts, if that is sharper ' +
        'than you intend.'));
      wrap.insertBefore(cliff, wrap.children[1]);
    });

    var groups = {};
    res.rules.forEach(function (r) {
      (groups[r.group] = groups[r.group] || []).push(r);
    });

    Object.keys(groups).forEach(function (g) {
      wrap.appendChild(QM.card(g, QM.table([
        { key: 'question', label: 'Question' },
        { key: 'good', label: 'Good answer' },
        { key: 'bad', label: 'Fault' },
        { key: 'impact', label: 'Impact', numeric: true,
          render: function (r) {
            if (r.blocking) return QM.el('span', 'pill danger', 'Refuses device');
            return QM.el('span', 'strong', '−' + r.impact);
          } },
        { key: 'notes', label: '',
          render: function (r) {
            if (!/NEEDS_APPROVAL/i.test(r.notes || '')) return QM.el('span');
            return QM.el('span', 'pill warn', 'Needs approval');
          } }
      ], groups[g], { onClick: editInspectionRule })));
    });

    /* ---- battery bands ------------------------------------------- */
    wrap.appendChild(QM.card('Battery health', QM.table([
      { key: 'minHealth', label: 'Health at least', numeric: true,
        render: function (b) { return b.minHealth + '%'; } },
      { key: 'label', label: 'Condition' },
      { key: 'fraction', label: 'Of the battery impact', numeric: true,
        render: function (b) { return Math.round(b.fraction * 100) + '%'; } }
    ], res.batteryBands)));

    return wrap;
  });
});

function editInspectionRule(rule) {
  var body = QM.el('div');

  body.appendChild(detailList([
    { label: 'Question', value: rule.question },
    { label: 'Good answer', value: rule.good },
    { label: 'Fault', value: rule.bad },
    { label: 'Input', value: rule.input }
  ]));

  if (rule.blocking) {
    body.appendChild(QM.el('div', 'notice warn',
      'This fault refuses the device outright rather than reducing its ' +
      'score, so its impact is not used.'));
  }

  var impact = QM.input('number', rule.impact);
  impact.min = 0; impact.max = 100;
  body.appendChild(QM.field('Points deducted', impact,
    'Out of 100. A flawless device scores 100 and grades A.'));

  var example = QM.el('div', 'notice');
  body.appendChild(example);

  /**
   * What this impact actually costs a customer.
   *
   * The score alone hides the important part. Grades are bands, so a
   * deduction that crosses a boundary is worth far more than one that
   * does not — seven points can cost nothing or thirty per cent of the
   * offer depending on where the device started. Showing the resulting
   * grade and price makes that cliff visible while it is being set,
   * rather than in an argument at a counter later.
   */
  function paint() {
    QM.clear(example);
    var v = Number(impact.value);
    if (!isFinite(v)) return;

    var score = Math.max(0, 100 - v);
    example.appendChild(QM.el('strong', null,
      'A device with only this fault scores ' + score));

    var ladder = window.__gradeLadder;
    if (!ladder) return;

    var earned = null;
    ladder.forEach(function (g) {
      if (earned === null && score >= g.minScore) earned = g;
    });
    if (!earned) return;

    var top = ladder[0];
    example.appendChild(document.createTextNode(
      ' — grade ' + earned.code + ', so on a 2,000 device the customer is ' +
      'offered ' + QM.money(2000 * earned.percentage) + ' instead of ' +
      QM.money(2000 * top.percentage) + '.'));

    if (earned.code !== top.code) {
      var drop = QM.el('div', 'small mt');
      drop.style.color = 'var(--warn)';
      drop.textContent = 'This single fault moves the device out of ' +
        top.code + '. Grades are bands, so the drop is ' +
        Math.round((1 - earned.percentage / top.percentage) * 100) +
        '% whether the fault is minor or severe.';
      example.appendChild(drop);
    }
  }

  if (!window.__gradeLadder) {
    QM.call('admin.gradeRules', {}).then(function (res) {
      if (res.ok) { window.__gradeLadder = res.grades; paint(); }
    });
  }
  paint();
  impact.oninput = paint;

  QM.modal({
    title: rule.question,
    body: body,
    confirmLabel: 'Save',
    collect: function () {
      var v = Number(impact.value);
      if (!isFinite(v) || v < 0 || v > 100) {
        QM.toast('An impact is between 0 and 100.', 'danger');
        return false;
      }
      return {
        code: rule.code, group: rule.group, question: rule.question,
        input: rule.input, good: rule.good, bad: rule.bad,
        impact: v, blocking: rule.blocking, order: rule.order,
        active: true, notes: ''   // clearing the note records approval
      };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.saveInspectionRule', data).then(function (res) {
      if (QM.report(res)) QM.go('a-inspection');
    });
  });
}

/**
 * One trade-in in full, including how the money was arrived at.
 *
 * The calculation is shown as a chain rather than a total, because a
 * total tells nobody why a customer was offered what they were offered.
 */
function showTradeIn(tradeInId) {
  QM.call('admin.tradeIn', { tradeInId: tradeInId }).then(function (res) {
    if (!res.ok) { QM.toast(res.message, 'danger'); return; }
    var t = res.tradeIn;

    var body = QM.el('div');

    body.appendChild(detailList([
      { label: 'Device',   value: t.device },
      { label: 'Colour',   value: t.color },
      { label: 'IMEI',     value: t.imeiFull },
      { label: 'Customer', value: t.customerName },
      { label: 'Phone',    value: t.customerPhone },
      { label: 'Vendor',   value: t.vendorName },
      { label: 'Status',   value: t.statusLabel },
      { label: 'Created',  value: t.createdDate }
    ]));

    /* ---- how the money was calculated ---------------------------- */
    if (t.basePriceSnapshot) {
      var calc = QM.el('div');
      calc.appendChild(QM.el('div', 'label mt', 'How this figure was reached'));
      calc.appendChild(detailList([
        { label: 'Base price at the time',
          value: QM.moneyCcy(t.basePriceSnapshot, t.currency) +
                 (t.priceEffectiveDate ? ' (set ' + t.priceEffectiveDate + ')' : '') },
        { label: 'Price source', value: t.pricingSource },
        { label: 'Grade', value: t.grade + ' — ' +
                 Math.round((t.gradePercentage || 0) * 100) + '% of base' },
        { label: 'Grade value', value: QM.moneyCcy(t.calculatedValue, t.currency) },
        { label: 'Manual adjustment', value: t.manualAdjustment
            ? QM.moneyCcy(t.manualAdjustment, t.currency) + ' — ' + t.adjustmentReason
            : null },
        { label: 'Customer receives', value: QM.moneyCcy(t.customerValue, t.currency) },
        { label: 'Vendor commission', value: QM.moneyCcy(t.commission, t.currency) +
                 ' at ' + (t.commissionRate * 100).toFixed(2).replace(/\.?0+$/, '') + '%' },
        { label: 'Total we pay', value: QM.moneyCcy(t.settlement, t.currency) }
      ]));
      body.appendChild(calc);

      body.appendChild(QM.el('div', 'hint',
        'These figures were frozen when the offer was made. Changing a price or ' +
        'a commission rate today does not alter them.'));
    }

    /* ---- estimated against final ---------------------------------
     * The two figures side by side, with the difference done for the
     * reader. It is the first question anybody asks about a trade-in
     * that went differently from how the customer expected.
     * -------------------------------------------------------------- */
    if (t.estimatedValue) {
      body.appendChild(QM.el('div', 'label mt', 'Estimated against final'));
      body.appendChild(detailList([
        { label: 'Customer estimate', value: QM.moneyCcy(t.estimatedValue, t.currency) +
                 (t.estimatedGrade ? ' at grade ' + t.estimatedGrade : '') },
        { label: 'Estimated score', value: t.estimatedScore },
        { label: 'Final offer', value: t.customerValue
            ? QM.moneyCcy(t.customerValue, t.currency) +
              (t.grade ? ' at grade ' + t.grade : '') : null },
        { label: 'Inspected score', value: t.conditionScore },
        { label: 'Difference', value: t.customerValue
            ? (t.variance >= 0 ? '+' : '') + QM.money(t.variance) + ' ' + t.currency +
              (t.variancePct === null ? ''
                : '  (' + (t.variancePct >= 0 ? '+' : '') + t.variancePct + '%)')
            : null }
      ]));
    }

    /* ---- what the customer said against what was found ------------ */
    if (t.comparison && t.comparison.length) {
      body.appendChild(QM.el('div', 'label mt', 'Customer against technician'));
      body.appendChild(QM.table([
        { key: 'item', label: 'Inspection item' },
        { key: 'customer', label: 'Customer answer' },
        { key: 'technician', label: 'Technician result' },
        { key: 'agrees', label: '',
          render: function (r) {
            if (r.agrees === null) return QM.el('span', 'muted', '—');
            return r.agrees ? QM.el('span', 'pill ok', 'Agrees')
                            : QM.el('span', 'pill warn', 'Differs');
          } }
      ], t.comparison));
      body.appendChild(QM.el('div', 'hint',
        'Both sides answered the same underlying checks, which is the only ' +
        'reason this table can be built at all. A row that differs is where ' +
        'the estimate and the offer parted company.'));
    }

    /* ---- inspection ---------------------------------------------- */
    if (t.inspection) {
      body.appendChild(QM.el('div', 'label mt', 'Inspection'));
      body.appendChild(detailList([
        { label: 'Technician', value: t.inspection.technician },
        { label: 'Started', value: t.inspection.startedAt },
        { label: 'Completed', value: t.inspection.completedAt },
        { label: 'Condition score', value: t.inspection.score },
        { label: 'Computed grade', value: t.inspection.grade },
        { label: 'Battery health', value: t.inspection.batteryHealth === null
            ? null : t.inspection.batteryHealth + '%' },
        { label: 'IMEI confirmed', value: t.inspection.imeiConfirmed ? 'Yes' : 'No' },
        { label: 'Activation lock', value: t.inspection.activationLock ? 'ON' : 'Off' },
        { label: 'Notes', value: t.inspection.notes }
      ]));

      if (t.inspection.faults && t.inspection.faults.length) {
        body.appendChild(QM.table([
          { key: 'group', label: 'Section' },
          { key: 'question', label: 'Check' },
          { key: 'answer', label: 'Found',
            render: function (f) {
              return f.fault ? QM.el('span', 'pill warn', f.answer)
                             : QM.el('span', 'pill ok', f.answer);
            } }
        ], t.inspection.faults));
      }

      /* ---- the evidence, finally viewable ------------------------
       * Photographs were uploaded and stored privately since V2 and no
       * screen could display one. tech.viewPhoto existed the whole time
       * with nothing calling it.
       * ------------------------------------------------------------ */
      if (t.inspection.photos && t.inspection.photos.length) {
        body.appendChild(QM.el('div', 'label mt',
          'Evidence (' + t.inspection.photos.length + ')'));
        body.appendChild(photoStrip(t.tradeInId, t.inspection.photos));
      } else {
        body.appendChild(QM.el('div', 'hint mt', 'No photographs were taken.'));
      }
    }

    /* ---- an overridden grade ------------------------------------- */
    if (t.gradeOverride) {
      var ov = QM.el('div', 'notice warn');
      ov.appendChild(QM.el('strong', null,
        'Grade overridden: ' + t.gradeOverride.from + ' → ' + t.gradeOverride.to));
      ov.appendChild(document.createTextNode(
        t.gradeOverride.reason + ' — ' + t.gradeOverride.by +
        ', ' + t.gradeOverride.date));
      body.appendChild(ov);
    }

    /* ---- the operational timeline -------------------------------- */
    if (t.timeline && t.timeline.length) {
      body.appendChild(QM.el('div', 'label mt', 'Timeline'));
      body.appendChild(QM.table([
        { key: 'date', label: 'When' },
        { key: 'label', label: 'What' },
        { key: 'user', label: 'Who' },
        { key: 'role', label: 'Role' },
        { key: 'notes', label: 'Detail' }
      ], t.timeline));
    }

    /* ---- corrections --------------------------------------------- */
    var actions = QM.el('div', 'btn-row mt');
    actions.appendChild(QM.button('Override grade', function () {
      document.querySelectorAll('.modal-scrim').forEach(function (s) { s.remove(); });
      overrideGrade(t);
    }, 'secondary small'));
    actions.appendChild(QM.button('Adjust value', function () {
      document.querySelectorAll('.modal-scrim').forEach(function (s) { s.remove(); });
      adjustValue(t);
    }, 'secondary small'));
    body.appendChild(actions);
    body.appendChild(QM.el('div', 'hint',
      'Both need a reason, both are recorded against your name, and both are ' +
      'refused once the device has been collected — at that point it is a ' +
      'credit note rather than an edit.'));

    QM.modal({
      title: t.tradeInId,
      body: body,
      confirmLabel: 'Close',
      cancelLabel: ''
    });
  });
}

/**
 * Inspection photographs.
 *
 * Fetched one at a time, on demand, through tech.viewPhoto — which
 * re-checks entitlement on the TRADE-IN before it touches the file. The
 * pictures are never given a URL, so there is no link to forward and
 * nothing to leak from a browser history.
 */
function photoStrip(tradeInId, photos) {
  var strip = QM.el('div', 'gap');

  photos.forEach(function (p) {
    var chip = QM.el('button', 'btn secondary small');
    chip.textContent = (p.category || 'OTHER').toLowerCase();
    chip.onclick = function () { viewPhoto(tradeInId, p); };
    strip.appendChild(chip);
  });

  return strip;
}

function viewPhoto(tradeInId, meta) {
  var body = QM.el('div');
  body.appendChild(QM.loadingBlock());

  QM.modal({
    title: (meta.category || 'Photograph'),
    body: body,
    confirmLabel: '',
    cancelLabel: 'Close'
  });

  QM.call('tech.viewPhoto', { tradeInId: tradeInId, fileId: meta.fileId })
    .then(function (res) {
      QM.clear(body);
      if (!res.ok) { body.appendChild(QM.errorBlock(res.message)); return; }

      var img = document.createElement('img');
      img.src = QM.safeImageUrl(res.dataUrl);
      img.alt = meta.category || '';
      img.style.width = '100%';
      img.style.borderRadius = 'var(--radius)';
      // Tap to zoom. A cracked screen at thumbnail size proves nothing.
      img.style.cursor = 'zoom-in';
      var zoomed = false;
      img.onclick = function () {
        zoomed = !zoomed;
        img.style.transform = zoomed ? 'scale(2)' : '';
        img.style.transformOrigin = 'center';
        img.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
      };
      body.appendChild(img);

      body.appendChild(detailList([
        { label: 'Shows',       value: meta.category },
        { label: 'Uploaded by', value: meta.uploadedBy },
        { label: 'Uploaded',    value: meta.uploadedAt }
      ]));
    });
}

/**
 * Change the grade, and reprice from the ladder.
 *
 * A grade is chosen; a price never is. Letting an administrator type a
 * number directly would make the ladder a suggestion, and the whole
 * pricing design rests on it not being one.
 */
function overrideGrade(t) {
  var body = QM.el('div');

  var warn = QM.el('div', 'notice warn');
  warn.appendChild(QM.el('strong', null, 'This changes what the customer is paid'));
  warn.appendChild(document.createTextNode(
    'The system graded this device ' + (t.grade || '—') + ' from the ' +
    'technician\'s answers. Overriding it keeps that grade on the record ' +
    'alongside yours, with your name and your reason.'));
  body.appendChild(warn);

  body.appendChild(detailList([
    { label: 'Device', value: t.device },
    { label: 'Computed grade', value: t.grade },
    { label: 'Current value', value: QM.moneyCcy(t.customerValue, t.currency) }
  ]));

  var grade = QM.select((t.grades || []).map(function (g) {
    return { value: g.code, label: g.code + ' — ' + g.name };
  }), t.grade);
  body.appendChild(QM.field('New grade', grade));

  var reason = QM.el('textarea');
  reason.placeholder = 'Why is the computed grade wrong for this device?';
  body.appendChild(QM.field('Reason', reason,
    'Recorded permanently against your name.'));

  QM.modal({
    title: 'Override the grade',
    body: body,
    danger: true,
    confirmLabel: 'Override',
    collect: function () {
      if (reason.value.trim().length < 6) {
        QM.toast('Give a reason.', 'danger'); return false;
      }
      return { tradeInId: t.tradeInId, gradeCode: grade.value,
               reason: reason.value.trim() };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.overrideGrade', data).then(function (res) {
      if (QM.report(res)) QM.go('a-tradeins');
    });
  });
}

function adjustValue(t) {
  var body = QM.el('div');

  body.appendChild(detailList([
    { label: 'Device', value: t.device },
    { label: 'Grade value', value: QM.moneyCcy(t.calculatedValue, t.currency) },
    { label: 'Current offer', value: QM.moneyCcy(t.customerValue, t.currency) }
  ]));

  var amount = QM.input('number', t.manualAdjustment || 0);
  amount.step = '1';
  body.appendChild(QM.field('Adjustment', amount,
    'Added to the grade value. A negative number reduces the offer. ' +
    'The commission is recomputed on the result.'));

  var reason = QM.el('textarea');
  reason.placeholder = 'Why is this device worth more or less than the ladder says?';
  body.appendChild(QM.field('Reason', reason));

  QM.modal({
    title: 'Adjust the value',
    body: body,
    confirmLabel: 'Adjust',
    collect: function () {
      if (reason.value.trim().length < 6) {
        QM.toast('Give a reason.', 'danger'); return false;
      }
      return { tradeInId: t.tradeInId, manualAdjustment: Number(amount.value),
               manualAdjustmentReason: reason.value.trim() };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.overridePrice', data).then(function (res) {
      if (QM.report(res)) QM.go('a-tradeins');
    });
  });
}

/**
 * One collection note, device by device.
 *
 * The important control here is the per-device outcome. V2 offered a
 * single "Mark collected" button that set the whole batch regardless of
 * what actually came back; the devices that did not turn up were reported
 * once in a toast and then invisible everywhere.
 */
function showBatch(batchId) {
  QM.call('admin.collections', { batchId: batchId }).then(function (res) {
    if (!res.ok) { QM.toast(res.message, 'danger'); return; }

    var body = QM.el('div');
    var open = ['DRAFT', 'READY_FOR_COLLECTION', 'PARTIALLY_COLLECTED',
                'COLLECTION_EXCEPTION'].indexOf(res.status) > -1;

    body.appendChild(detailList([
      { label: 'Vendor', value: res.vendorName },
      { label: 'Branch', value: res.branchName },
      { label: 'Expected devices', value: res.expectedDevices },
      { label: 'Collected', value: res.collectedDevices },
      { label: 'Missing', value: res.missingDevices || null },
      { label: 'Exceptions', value: res.exceptionDevices || null },
      { label: 'Expected amount', value: QM.moneyCcy(res.expectedAmount, res.currency) },
      { label: 'Actual amount', value: QM.moneyCcy(res.actualAmount, res.currency) },
      { label: 'Status', value: res.statusLabel },
      { label: 'Created', value: res.createdDate },
      { label: 'Collected', value: res.collectedDate },
      { label: 'Collected by', value: res.collectedBy }
    ]));

    if (res.missingDevices || res.exceptionDevices) {
      var warn = QM.el('div', 'notice warn');
      warn.appendChild(QM.el('strong', null,
        (res.missingDevices + res.exceptionDevices) + ' device(s) unaccounted for'));
      warn.appendChild(document.createTextNode(
        'They have been released back to the branch so they can be collected ' +
        'on a later note. This note cannot be closed until they are resolved.'));
      body.appendChild(warn);
    }

    /* ---- the lines, each with its own outcome -------------------- */
    var decisions = {};

    body.appendChild(QM.table([
      { key: 'tradeInId', label: 'Reference', className: 'mono' },
      { key: 'device', label: 'Device' },
      { key: 'imei', label: 'IMEI', className: 'mono' },
      { key: 'grade', label: 'Grade' },
      { key: 'settlement', label: 'Value', numeric: true,
        render: function (r) { return QM.money(r.settlement); } },
      { key: 'itemStatus', label: 'Outcome',
        render: function (r) {
          if (r.itemStatus !== 'PENDING') {
            var kind = r.itemStatus === 'COLLECTED' ? 'ok' : 'warn';
            var pill = QM.el('span', 'pill ' + kind, r.itemStatus.toLowerCase());
            if (r.reason) pill.title = r.reason;
            return pill;
          }
          if (!open) return QM.el('span', 'muted', 'pending');

          // Defaults to COLLECTED, because the usual case is that the
          // whole note came back and nobody should have to confirm
          // twenty devices one at a time to record that.
          var select = QM.select([
            { value: 'COLLECTED', label: 'Collected' },
            { value: 'MISSING',   label: 'Missing' },
            { value: 'REJECTED',  label: 'Rejected' },
            { value: 'EXCEPTION', label: 'Other problem' }
          ], 'COLLECTED');
          select.onchange = function () {
            decisions[r.tradeInId] = select.value;
          };
          return select;
        } }
    ], res.devices));

    if (open) {
      body.appendChild(QM.el('div', 'hint',
        'Anything not marked Collected stays with the branch and comes back ' +
        'onto the pending list. Only devices marked Collected can be settled.'));

      var reason = QM.el('textarea');
      reason.placeholder = 'Anything worth recording about this collection.';
      body.appendChild(QM.field('Notes (optional)', reason));
    }

    QM.modal({
      title: 'Collection note ' + res.batchId,
      body: body,
      confirmLabel: open ? 'Record collection' : 'Print',
      cancelLabel: 'Close'
    }).then(function (act) {
      if (!act) return;
      if (!open) { window.print(); return; }

      var items = Object.keys(decisions).map(function (tradeInId) {
        return {
          tradeInId: tradeInId,
          status: decisions[tradeInId],
          reason: decisions[tradeInId] === 'COLLECTED' ? ''
                : 'Recorded at collection as ' + decisions[tradeInId].toLowerCase() + '.'
        };
      });

      var notCollected = items.filter(function (i) { return i.status !== 'COLLECTED'; });

      var proceed = function () {
        QM.call('admin.updateBatch', {
          batchId: batchId, items: items, notes: reason ? reason.value : ''
        }).then(function (r2) {
          if (QM.report(r2)) QM.go('a-collections');
        });
      };

      // Anything not collected needs a reason on the record, so it is
      // asked for once rather than defaulted silently.
      if (notCollected.length) {
        QM.askReason('Why were ' + notCollected.length + ' device(s) not collected?',
          'This is recorded against each device and shown on the note.', true)
          .then(function (why) {
            if (!why) return;
            notCollected.forEach(function (i) { i.reason = why; });
            proceed();
          });
        return;
      }
      proceed();
    });
  });
}

function newSettlement() {
  var body = QM.el('div');

  var vendor = QM.select([{ value: '', label: 'Choose a vendor' }]);
  body.appendChild(QM.field('Vendor', vendor));

  QM.call('admin.vendors', {}).then(function (res) {
    if (!res.ok) return;
    res.vendors.filter(function (v) { return v.active; }).forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v.vendorId; opt.textContent = v.name;
      vendor.appendChild(opt);
    });
  });

  var from = QM.input('date');
  var to = QM.input('date');
  body.appendChild(QM.field('From', from));
  body.appendChild(QM.field('To', to));

  var preview = QM.el('div');
  body.appendChild(preview);

  var check = QM.button('Preview', function () {
    if (!vendor.value || !from.value || !to.value) {
      QM.toast('Choose a vendor and a period.', 'danger'); return;
    }
    QM.clear(preview);
    preview.appendChild(QM.loadingBlock());

    QM.call('admin.settlements', {
      preview: true, vendorId: vendor.value, from: from.value, to: to.value
    }).then(function (res) {
      QM.clear(preview);
      if (!res.ok) { preview.appendChild(QM.el('div', 'notice danger', res.message)); return; }

      var n = QM.el('div', 'notice ' + (res.tradeInCount ? 'ok' : 'warn'));
      n.appendChild(QM.el('strong', null,
        res.tradeInCount + ' device(s), ' + QM.moneyCcy(res.settlement, res.currency)));
      n.appendChild(document.createTextNode(
        'Only devices we have actually collected are included.'));
      preview.appendChild(n);
    });
  }, 'secondary block');
  body.appendChild(check);

  QM.modal({
    title: 'New settlement',
    body: body,
    confirmLabel: 'Create',
    collect: function () {
      if (!vendor.value || !from.value || !to.value) return false;
      return { vendorId: vendor.value, from: from.value, to: to.value };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.createSettlement', data).then(function (res) {
      if (QM.report(res)) QM.go('a-settlements');
    });
  });
}

function showAdminSettlement(row) {
  QM.call('admin.settlements', { settlementId: row.settlementId }).then(function (res) {
    if (!res.ok) { QM.toast(res.message, 'danger'); return; }

    var body = QM.el('div');
    body.appendChild(detailList([
      { label: 'Vendor', value: res.vendorName },
      { label: 'Period', value: res.periodFrom + ' to ' + res.periodTo },
      { label: 'Devices', value: res.tradeInCount },
      { label: 'Paid to customers', value: QM.moneyCcy(res.customerValue, res.currency) },
      { label: 'Commission', value: QM.moneyCcy(res.commission, res.currency) },
      { label: 'Total', value: QM.moneyCcy(res.settlement, res.currency) },
      { label: 'Status', value: res.status },
      { label: 'Payment reference', value: res.reference }
    ]));

    if (res.locked) {
      body.appendChild(QM.el('div', 'notice',
        'This settlement is approved, so its contents are frozen. Changes need ' +
        'an adjustment rather than an edit.'));
    }

    var next = {
      DRAFT: 'SUBMITTED', SUBMITTED: 'APPROVED',
      APPROVED: 'PAID', PAID: 'CLOSED', CLOSED: null
    }[res.status];

    if (res.lines && res.lines.length) {
      body.appendChild(QM.table([
        { key: 'tradeInId', label: 'Reference', className: 'mono' },
        { key: 'device', label: 'Device' },
        { key: 'customerValue', label: 'Customer', numeric: true,
          render: function (r) { return QM.money(r.customerValue); } },
        { key: 'commission', label: 'Commission', numeric: true,
          render: function (r) { return QM.money(r.commission); } },
        { key: 'settlement', label: 'Total', numeric: true,
          render: function (r) { return QM.money(r.settlement); } }
      ], res.lines));
    }

    QM.modal({
      title: 'Settlement ' + res.settlementId,
      body: body,
      confirmLabel: next ? ('Move to ' + next.toLowerCase()) : 'Print',
      cancelLabel: 'Close'
    }).then(function (act) {
      if (!act) return;
      if (!next) { window.print(); return; }

      // Marking paid needs a bank reference. Without it, a payment
      // exists in this system and nowhere else.
      if (next === 'PAID') {
        var refBody = QM.el('div');
        var ref = QM.input('text', '', 'Bank transfer reference');
        refBody.appendChild(QM.field('Payment reference', ref,
          'So this settlement can be matched to the bank statement.'));

        QM.modal({
          title: 'Record payment',
          body: refBody,
          confirmLabel: 'Mark paid',
          collect: function () {
            if (!ref.value.trim()) return false;
            return ref.value.trim();
          }
        }).then(function (reference) {
          if (!reference) return;
          QM.call('admin.advanceSettlement', {
            settlementId: res.settlementId, toStatus: 'PAID',
            paymentReference: reference
          }).then(function (r2) {
            if (QM.report(r2)) QM.go('a-settlements');
          });
        });
        return;
      }

      QM.call('admin.advanceSettlement', {
        settlementId: res.settlementId, toStatus: next
      }).then(function (r2) {
        if (QM.report(r2)) QM.go('a-settlements');
      });
    });
  });
}

function editVendor(vendor) {
  var body = QM.el('div');
  var isNew = !vendor;

  var name = QM.input('text', vendor ? vendor.name : '');
  body.appendChild(QM.field('Vendor name', name));

  var code = QM.input('text', vendor ? vendor.code : '');
  code.maxLength = 6;
  code.disabled = !isNew;
  body.appendChild(QM.field('Short code', code, isNew
    ? 'Two to six letters. It becomes part of every trade-in number, such as ' +
      'TI-CAR-000042.'
    : 'The code cannot be changed — existing trade-in numbers use it.'));

  var rate = QM.input('number', vendor ? vendor.commissionRate : 0.05);
  rate.min = 0; rate.max = 1; rate.step = '0.005';
  body.appendChild(QM.field('Default commission', rate,
    'A fraction. Five percent is 0.05. Specific rules can override it per brand ' +
    'or product.'));

  var contact = QM.input('text', vendor ? vendor.contactName : '');
  body.appendChild(QM.field('Contact name', contact));

  var phone = QM.input('tel', vendor ? vendor.contactPhone : '');
  body.appendChild(QM.field('Contact phone', phone));

  var terms = QM.el('textarea');
  terms.value = vendor ? vendor.settlementTerms : '';
  body.appendChild(QM.field('Settlement terms', terms));

  var statusSelect = null;
  if (!isNew) {
    statusSelect = QM.select([
      { value: 'ACTIVE', label: 'Active' },
      { value: 'INACTIVE', label: 'Inactive' }
    ], vendor.status);
    body.appendChild(QM.field('Status', statusSelect,
      'Making a vendor inactive signs out all of their staff and stops new ' +
      'trade-ins. Their history is kept.'));
  }

  QM.modal({
    title: isNew ? 'Add a vendor' : vendor.name,
    body: body,
    confirmLabel: 'Save',
    collect: function () {
      if (name.value.trim().length < 2) { QM.toast('Enter a name.', 'danger'); return false; }
      if (isNew && code.value.trim().length < 2) {
        QM.toast('Enter a short code.', 'danger'); return false;
      }
      var out = {
        vendorId: vendor ? vendor.vendorId : '',
        name: name.value.trim(),
        code: code.value.trim(),
        commissionRate: Number(rate.value),
        contactName: contact.value.trim(),
        contactPhone: phone.value.trim(),
        settlementTerms: terms.value.trim()
      };
      if (statusSelect) out.status = statusSelect.value;
      return out;
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.saveVendor', data).then(function (res) {
      if (QM.report(res)) QM.go('a-vendors');
    });
  });
}

/**
 * One product, with everything about it editable HERE.
 *
 * V2 could list a product and could not add a storage size to it. The
 * server had admin.saveVariant and admin.saveColor the whole time and no
 * screen called either, so a new model meant opening the spreadsheet by
 * hand — on the sheet whose columns the whole system resolves by name.
 */
function showProduct(productId) {
  QM.call('admin.product', { productId: productId }).then(function (res) {
    if (!res.ok) { QM.toast(res.message, 'danger'); return; }

    var body = QM.el('div');

    body.appendChild(detailList([
      { label: 'Model',       value: res.product.model },
      { label: 'Model code',  value: res.product.modelCode },
      { label: 'Device type', value: res.product.deviceType },
      { label: 'Released',    value: res.product.releaseYear },
      { label: 'Visible',     value: res.product.active ? 'Yes' : 'Hidden' }
    ]));

    if (QM.safeImageUrl(res.product.imageUrl)) {
      var img = document.createElement('img');
      img.src = QM.safeImageUrl(res.product.imageUrl);
      img.alt = '';
      img.style.maxHeight = '110px';
      body.appendChild(img);
    }

    var picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = 'image/*';
    body.appendChild(QM.field('Product photograph', picker,
      'Shown to customers choosing a model. Under 2 MB.'));
    picker.onchange = function () {
      var file = picker.files && picker.files[0];
      if (!file) return;
      readAsDataUrl(file).then(function (p) {
        QM.call('admin.uploadMedia', {
          kind: 'PRODUCT', objectId: productId, dataUrl: p.dataUrl
        }).then(function (r) {
          if (QM.report(r)) {
            document.querySelectorAll('.modal-scrim').forEach(function (s) { s.remove(); });
            showProduct(productId);
          }
        });
      });
    };

    /* ---- storage sizes -------------------------------------------- */
    body.appendChild(QM.el('div', 'label mt', 'Storage sizes'));
    body.appendChild(QM.button('Add a storage size', function () {
      editVariant(productId, null);
    }, 'small mb'));
    body.appendChild(QM.table([
      { key: 'storage', label: 'Storage' },
      { key: 'basePrice', label: 'Base price', numeric: true,
        render: function (r) {
          return r.priced ? QM.money(r.basePrice)
                          : QM.el('span', 'pill warn', 'No price');
        } },
      { key: 'ladder', label: 'Ladder',
        render: function (r) {
          if (!r.ladder.length) return QM.el('span', 'muted', '—');
          var box = QM.el('div', 'gap');
          r.ladder.forEach(function (g) {
            box.appendChild(QM.el('span', 'pill', g.code + ' ' + QM.money(g.value)));
          });
          return box;
        } },
      { key: 'active', label: 'Status',
        render: function (r) {
          return QM.el('span', 'pill ' + (r.active ? 'ok' : ''),
                       r.active ? 'Live' : 'Hidden');
        } }
    ], res.variants, {
      onClick: function (row) { editVariant(productId, row); }
    }));

    /* ---- colours --------------------------------------------------- */
    body.appendChild(QM.el('div', 'label mt', 'Colours'));
    body.appendChild(QM.el('div', 'hint',
      'Colour identifies the handset in the box. It does not change the price, ' +
      'which is why it hangs on the product and not on a price row.'));
    body.appendChild(QM.button('Add a colour', function () {
      editColor(productId, null);
    }, 'small mb'));

    if (res.colors.length) {
      body.appendChild(QM.table([
        { key: 'color', label: 'Colour' },
        { key: 'imageUrl', label: 'Image',
          render: function (c) {
            if (!QM.safeImageUrl(c.imageUrl)) return QM.el('span', 'muted', '—');
            var i = document.createElement('img');
            i.src = QM.safeImageUrl(c.imageUrl); i.alt = '';
            i.style.maxHeight = '26px';
            return i;
          } },
        { key: 'active', label: 'Status',
          render: function (c) {
            return QM.el('span', 'pill ' + (c.active ? 'ok' : ''),
                         c.active ? 'Live' : 'Hidden');
          } }
      ], res.colors, {
        onClick: function (row) { editColor(productId, row); }
      }));
    }

    QM.modal({
      title: res.product.model,
      body: body,
      confirmLabel: 'Edit model',
      cancelLabel: 'Close'
    }).then(function (edit) {
      if (edit) editProduct(res.product, res.deviceTypes);
    });
  });
}

function editProduct(product, deviceTypes) {
  var body = QM.el('div');

  var brand = QM.select([{ value: '', label: 'Choose a brand' }],
                        product ? product.brandId : '');
  body.appendChild(QM.field('Brand', brand));

  QM.call('admin.brands', {}).then(function (res) {
    if (!res.ok) return;
    res.brands.forEach(function (b) {
      var opt = document.createElement('option');
      opt.value = b.brandId; opt.textContent = b.name;
      if (product && product.brandId === b.brandId) opt.selected = true;
      brand.appendChild(opt);
    });
  });

  var category = QM.select([{ value: '', label: 'No category' }],
                           product ? product.categoryId : '');
  body.appendChild(QM.field('Category', category));

  QM.call('admin.categories', {}).then(function (res) {
    if (!res.ok) return;
    res.categories.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.categoryId; opt.textContent = c.name;
      if (product && product.categoryId === c.categoryId) opt.selected = true;
      category.appendChild(opt);
    });
  });

  var model = QM.input('text', product ? product.model : '');
  body.appendChild(QM.field('Model name', model, 'As a customer would say it.'));

  var modelCode = QM.input('text', product ? product.modelCode : '');
  body.appendChild(QM.field('Model number (optional)', modelCode,
    'The manufacturer\'s code, such as A2894 or SM-S928B.'));

  var types = (deviceTypes || [
    { value: 'SMARTPHONE', label: 'Smartphone' },
    { value: 'TABLET', label: 'Tablet' },
    { value: 'WATCH', label: 'Smartwatch' },
    { value: 'LAPTOP', label: 'Laptop' },
    { value: 'AUDIO', label: 'Earbuds or headphones' },
    { value: 'OTHER', label: 'Other' }
  ]);
  var deviceType = QM.select([{ value: '', label: 'Not set' }].concat(types),
                             product ? product.deviceType : '');
  body.appendChild(QM.field('Device type', deviceType,
    'A short fixed list, so reports do not end up with four spellings of ' +
    '"phone".'));

  var year = QM.input('number', product ? product.releaseYear : '');
  body.appendChild(QM.field('Release year (optional)', year));

  var keywords = QM.input('text', product ? product.keywords : '');
  body.appendChild(QM.field('Search keywords (optional)', keywords,
    'Other names customers might search for.'));

  var active = document.createElement('input');
  active.type = 'checkbox';
  active.checked = product ? product.active : true;
  active.style.width = 'auto'; active.style.minHeight = 'auto';
  var activeLabel = QM.el('label');
  activeLabel.appendChild(active);
  activeLabel.appendChild(document.createTextNode(' Show to customers'));
  var af = QM.el('div', 'field');
  af.appendChild(activeLabel);
  af.appendChild(QM.el('div', 'hint',
    'Hiding a model stops new trade-ins. Nothing is deleted — old trade-ins ' +
    'still name it.'));
  body.appendChild(af);

  QM.modal({
    title: product ? 'Edit model' : 'Add a model',
    body: body,
    confirmLabel: 'Save',
    collect: function () {
      if (!brand.value) { QM.toast('Choose a brand.', 'danger'); return false; }
      if (model.value.trim().length < 2) {
        QM.toast('Enter the model name.', 'danger'); return false;
      }
      return {
        productId: product ? product.productId : '',
        brandId: brand.value,
        categoryId: category.value,
        model: model.value.trim(),
        modelCode: modelCode.value.trim(),
        deviceType: deviceType.value,
        releaseYear: year.value,
        keywords: keywords.value.trim(),
        active: active.checked
      };
    }
  }).then(function (data) {
    if (!data) return;
    QM.call('admin.saveProduct', data).then(function (res) {
      if (!QM.report(res)) return;
      if (!data.productId) {
        QM.toast('Add storage sizes next, then set prices.', 'ok');
      }
      QM.go('a-products');
    });
  });
}

/* ====================================================================
 * BULK IMPORT
 *
 * Two steps, and the first one writes nothing. A catalogue import that
 * goes straight in is how sixty duplicate products appear from one
 * mistyped column heading.
 * ================================================================== */

QM.route('a-import', function () {
  var wrap = QM.el('div');

  var note = QM.el('div', 'notice');
  note.appendChild(QM.el('strong', null, 'Preview first, always'));
  note.appendChild(document.createTextNode(
    'Paste rows below, check what the preview says it will create, and only ' +
    'then import. Nothing is written until you press Import.'));
  wrap.appendChild(note);

  var help = QM.el('div', 'hint mb');
  help.textContent = 'One device per line, comma separated: ' +
    'Brand, Category, Model, Storage, Colour, BasePrice. ' +
    'The price may be left empty — the model is created unpriced and cannot ' +
    'be quoted until you set one.';
  wrap.appendChild(help);

  var area = QM.el('textarea');
  area.rows = 10;
  area.placeholder = 'Apple, Smartphones, iPhone 15, 128GB, Black, 1800\n' +
                     'Apple, Smartphones, iPhone 15, 256GB, Black, 2100\n' +
                     'Samsung, Smartphones, Galaxy S24, 256GB, Grey, 1900';
  wrap.appendChild(QM.field('Rows', area));

  var results = QM.el('div');
  wrap.appendChild(results);

  function parse() {
    return area.value.split('\n')
      .map(function (line) { return line.trim(); })
      .filter(Boolean)
      .map(function (line) {
        var cells = line.split(',').map(function (c) { return c.trim(); });
        return {
          Brand: cells[0], Category: cells[1], Model: cells[2],
          Storage: cells[3], Colour: cells[4],
          BasePrice: cells[5] === undefined ? '' : cells[5]
        };
      })
      // A header row pasted in with the data is skipped rather than
      // imported as a product called "Model".
      .filter(function (r) {
        return String(r.Brand).toLowerCase() !== 'brand';
      });
  }

  var row = QM.el('div', 'btn-row mb');

  row.appendChild(QM.button('Preview', function () {
    var rows = parse();
    if (!rows.length) { QM.toast('Paste some rows first.', 'danger'); return; }

    QM.clear(results);
    results.appendChild(QM.loadingBlock());

    QM.call('admin.previewImport', { rows: rows }).then(function (res) {
      QM.clear(results);
      if (!res.ok) { results.appendChild(QM.errorBlock(res.message)); return; }

      var summary = QM.el('div', 'notice ' + (res.problems.length ? 'warn' : 'ok'));
      summary.appendChild(QM.el('strong', null,
        res.willImport + ' row(s) would be imported'));
      summary.appendChild(document.createTextNode(
        res.newBrands.length + ' new brand(s), ' +
        res.newProducts.length + ' new model(s), ' +
        res.variantCount + ' storage size(s).'));
      results.appendChild(summary);

      if (res.problems.length) {
        var bad = QM.el('div', 'notice danger');
        bad.appendChild(QM.el('strong', null,
          res.problems.length + ' row(s) will be skipped'));
        var ul = QM.el('ul');
        ul.style.margin = '.4rem 0 0'; ul.style.paddingLeft = '1.2rem';
        res.problems.slice(0, 20).forEach(function (p) {
          ul.appendChild(QM.el('li', null, p));
        });
        bad.appendChild(ul);
        results.appendChild(bad);
      }

      results.appendChild(QM.button('Import ' + res.willImport + ' row(s)',
        function () {
          QM.call('admin.applyImport', { rows: res.rows }).then(function (r2) {
            if (QM.report(r2)) QM.go('a-products');
          });
        }, 'gold block'));
    });
  }));

  wrap.appendChild(row);
  return wrap;
});

  } else {
    body.appendChild(detailList([
      { label: 'Name', value: person.name },
      { label: 'Phone', value: person.phone },
      { label: 'Last signed in', value: person.lastLogin }
    ]));
  }

  var role = QM.select(
    [{ value: '', label: 'Choose a role' }].concat(
      grantableRoles.map(function (r) { return { value: r.role, label: r.label }; })),
    person ? person.role : '');
  body.appendChild(QM.field('Role', role));

  var vendor = QM.select([{ value: '', label: 'Qatar Mobile (no vendor)' }],
                         person ? person.vendorId : '');
  var vendorField = QM.field('Vendor', vendor,
    'Only for vendor roles. Platform staff work across every vendor.');
  body.appendChild(vendorField);

  QM.call('admin.vendors', {}).then(function (res) {
    if (!res.ok) return;
    res.vendors.filter(function (v) { return v.active; }).forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v.vendorId; opt.textContent = v.name;
      if (person && person.vendorId === v.vendorId) opt.selected = true;
      vendor.appendChild(opt);
    });
  });

  function syncVendorVisibility() {
    var vendorRole = ['VENDOR_ADMIN', 'VENDOR_MANAGER', 'VENDOR_STAFF']
                       .indexOf(role.value) > -1;
    vendorField.classList.toggle('hidden', !vendorRole);
  }
  syncVendorVisibility();
  role.onchange = syncVendorVisibility;

  var statusSelect = null;
  if (person && !isPending) {
    statusSelect = QM.select([
      { value: 'ACTIVE', label: 'Active' },
      { value: 'DISABLED', label: 'Disabled' }
    ], person.status);
    body.appendChild(QM.field('Status', statusSelect,
      'Disabling signs them out immediately. The last platform owner cannot ' +
      'be disabled.'));
  }

  QM.modal({
    title: isNew ? 'Add staff' : isPending ? 'Approve access' : person.name,
    body: body,
    confirmLabel: isPending ? 'Approve' : 'Save',
    collect: function () {
      if (!role.value) { QM.toast('Choose a role.', 'danger'); return false; }
      var out = {
        mode: isNew ? 'CREATE' : 'UPDATE',
        decision: 'APPROVE',
        userId: person ? person.userId : '',
        fullName: name.value.trim(),
        phone: phone.value.trim(),
        role: role.value,
        vendorId: vendor.value
      };
      if (statusSelect) out.status = statusSelect.value;
      return out;
    }
  }).then(function (data) {
    if (!data) return;
    var action = isPending ? 'admin.approveStaff' : 'admin.updateStaff';
    QM.call(action, data).then(function (res) {
      if (QM.report(res)) QM.go('a-staff');
    });
  });
}
